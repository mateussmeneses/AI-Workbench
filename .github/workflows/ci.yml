name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e . build
      - name: Run tests
        run: python -W default::DeprecationWarning -m unittest discover -s tests -v
      - name: Validate CLI
        run: python -m aiwh doctor
      - name: Build wheel and sdist
        run: python -m build --outdir dist
      - name: Prepare dependency wheelhouse
        run: |
          python -m pip download --only-binary=:all: --dest .package-wheels "PyYAML>=6.0.3,<7"
      - name: Verify isolated package installation
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          $sdist = (Get-ChildItem dist/*.tar.gz).FullName
          python scripts/Verify-Package.py --wheel $wheel --sdist $sdist --wheelhouse .package-wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
