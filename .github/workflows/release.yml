name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . build
      - run: python -m unittest discover -s tests -v
      - run: python -m aiwh doctor
      - name: Build wheel and sdist
        run: python -m build --outdir dist
      - name: Prepare dependency wheelhouse
        run: |
          python -m pip download --only-binary=:all: --dest .package-wheels "PyYAML>=6.0.3,<7"
      - name: Verify isolated package installation
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          $sdist = (Get-ChildItem dist/*.tar.gz).FullName
          python scripts/Verify-Package.py --wheel $wheel --sdist $sdist --wheelhouse .package-wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "AI Workbench $TAG"
          fi
