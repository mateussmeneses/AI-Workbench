# Example MCP servers to adapt into ~/.hermes/config.yaml.
# Do NOT paste into your config without checking settings/credentials and selecting only the MCPs you need.
mcp_servers:
  playwright:
    command: npx
    args: ["-y", "@playwright/mcp@latest"]
    enabled: false
    lazy: true
  chrome-devtools:
    command: npx
    args: ["-y", "chrome-devtools-mcp@latest"]
    enabled: false
    lazy: true
  # Azure DevOps: your organization's official authentication must be configured.
  # azure-devops:
  #   url: https://mcp.dev.azure.com/YOUR_ORGANIZATION
  #   auth: oauth
  #   enabled: false
