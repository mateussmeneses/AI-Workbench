[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workbench"
version = "0.3.0"
description = "Local-first portable project bootstrap, continuity and AI capability registry"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
aiwh = "aiwh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiwh = ["taxonomy.json"]
